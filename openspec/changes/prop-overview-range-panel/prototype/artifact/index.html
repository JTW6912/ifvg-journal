<!doctype html>
<html lang="zh-CN" data-layout="modern" data-theme="light" data-palette="graphite" style="--pnlPos:#7dba9d">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; form-action 'none'; base-uri 'none'">
<title>IFVG Journal · Prop overview prototype</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/product.css">
<link rel="stylesheet" href="assets/product-modern.css">
<link rel="stylesheet" href="assets/project-base-tokens.css">
<link rel="stylesheet" href="assets/project-palettes.css">
<link rel="stylesheet" href="assets/preview-base.css">
<link rel="stylesheet" href="assets/shadcn-adapter.css">
<link rel="stylesheet" href="assets/field-tooltips.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg class="symbols" aria-hidden="true"><defs>
<symbol id="wallet" viewBox="0 0 24 24"><path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9h-5a3 3 0 0 0 0 6h5M3 7h16"/><path d="M16 12h.01"/></symbol>
<symbol id="coins" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 8h-4a2 2 0 0 0 0 4h2a2 2 0 0 1 0 4H9m3-10v12"/></symbol>
<symbol id="trend" viewBox="0 0 24 24"><path d="m3 16 6-6 4 4 8-9m-7 0h7v7"/></symbol>
<symbol id="trendDown" viewBox="0 0 24 24"><path d="m3 8 6 6 4-4 8 9m-7 0h7v-7"/></symbol>
<symbol id="trendFlat" viewBox="0 0 24 24"><path d="M4 12h16m-4-4 4 4-4 4"/></symbol>
<symbol id="arrows" viewBox="0 0 24 24"><path d="M4 7h16m-4-4 4 4-4 4M20 17H4m4-4-4 4 4 4"/></symbol>
<symbol id="accounts" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M6 16c0-3 6-3 6 0m3-7h3m-3 4h3"/></symbol>
<symbol id="calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 11h18"/></symbol>
<symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-9v.01"/></symbol>
<symbol id="chevronLeft" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
<symbol id="chevronRight" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
<symbol id="chevronDown" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
</defs></svg>
<div id="app" class="wrap" data-specnav-project-shell="ifvg-modern" data-specnav-screen="prop-overview" data-specnav-variant="approved-panel">
<div class="header" id="appHeader" data-specnav-component="app-header"></div>
<div class="nav" id="appNav" data-specnav-component="app-navigation"></div>
<div id="tabBody"><div id="propTabs" data-specnav-component="prop-tabs"></div>
<main class="stage" data-node="editorial">
  <div class="preview-heading"><strong>合成数据 · 设计交接预览</strong><span>仅在本机，不连接数据库</span></div>
  <div class="preview-controls" data-node="editorial/preview-controls" aria-label="仅影响设计稿的主题选项">
    <label>配色<select id="previewPalette"><option value="graphite">石墨</option><option value="gold">黑金</option><option value="sky">晴空</option><option value="violet">紫罗兰</option><option value="rose">樱花粉</option><option value="sunset">落日橙</option><option value="ocean">深海青</option></select></label>
    <label>模式<select id="previewTheme" data-specnav-theme-control="mode"><option value="light">浅色</option><option value="dark">深色</option></select></label>
    <label>盈利<input id="previewGainColor" type="color" value="#7dba9d"></label>
    <label>亏损<input id="previewLossColor" type="color" value="#b0544b"></label>
    <button type="button" id="previewResetGain" class="ui-button" data-variant="ghost">恢复默认盈亏色</button>
    <label>语言<select id="previewLocale" data-specnav-locale-control="locale"><option value="en" selected>English</option><option value="zh">中文</option></select></label>
    <label>状态<select id="previewState"><option value="populated">有收支</option><option value="empty">空区间</option><option value="error">加载错误</option><option value="disabled">不可选择</option></select></label>
    <span class="control-note">仅切换预览，不改变账号设置</span>
  </div>
  <div id="prototypeError" class="notice error" role="alert" hidden>账本加载失败。此处为离线错误示例。</div>
  <section class="board" data-slot="card" data-node="editorial/board" data-specnav-component="prop-finance" data-specnav-state="populated" aria-label="Prop资金概览">
    <header class="board-header" data-slot="card-header" data-node="editorial/header">
      <div class="brand-heading"><span class="mark" aria-hidden="true"><svg><use href="#wallet"/></svg></span><h1>资金概览</h1></div>
      <div class="header-tools" data-slot="card-action">
        <button type="button" id="rangeTrigger" class="ui-button range-trigger" data-variant="outline" aria-haspopup="dialog" aria-expanded="false" aria-controls="rangePicker"><svg aria-hidden="true"><use href="#calendar"/></svg><span id="rangeButtonLabel">2026.10.01 – 10.26</span><svg class="chevron" aria-hidden="true"><use href="#chevronDown"/></svg></button>
        <span class="currency-unit">USD</span>
      </div>
    </header>
    <p id="rangeError" class="range-error" role="alert" hidden></p>
    <div class="board-body" data-slot="card-content">
      <section id="netZone" class="zone net-zone" data-tone="positive" data-node="editorial/net">
        <h2 class="zone-heading"><span class="section-icon" aria-hidden="true"><svg><use href="#coins"/></svg></span><span id="netTitleText">区间净收益</span><button type="button" class="field-info" data-help="net" aria-label="净收益说明"><svg aria-hidden="true"><use href="#info"/></svg></button></h2>
        <div class="net-spotlight" data-node="editorial/net-context">
          <div id="netValue" class="net-value" aria-label="合成数据净收益"><span id="netPrefix" class="net-sign">+$</span><span><span id="netInteger">0</span><span id="netFraction" class="net-decimal">.00</span></span></div>
          <figure class="net-trend" data-node="editorial/range-trend"><figcaption class="trend-heading field-label"><span id="trendHeading">区间走势</span><button type="button" class="field-info" data-help="trend" aria-label="收益走势说明"><svg aria-hidden="true"><use href="#info"/></svg></button></figcaption><svg id="rangeTrend" class="trend-plot" viewBox="0 0 180 100" preserveAspectRatio="none" role="img" aria-label="区间累计净收益走势"></svg><div id="rangeTrendEmpty" class="trend-empty" hidden>该区间暂无收支</div><div id="trendDates" class="trend-dates"><span id="trendStart">10.01</span><span id="trendEnd">10.26</span></div></figure>
        </div>
        <div class="roi-block" data-node="editorial/roi"><span class="roi-icon" aria-hidden="true"><svg><use id="roiDirection" href="#trend"/></svg></span><strong id="roiValue" class="roi-number">—</strong><span class="roi-label field-label"><span>投资回报率 · ROI</span><button type="button" class="field-info" data-help="roi" aria-label="投资回报率说明"><svg aria-hidden="true"><use href="#info"/></svg></button></span></div>
      </section>
      <section class="zone cash-zone" data-node="editorial/cashflow">
        <h2 class="zone-heading"><span class="section-icon" aria-hidden="true"><svg><use href="#arrows"/></svg></span>投入与到账</h2>
        <figure id="cashFigure" class="cash-figure" data-node="editorial/cashflow/chart">
          <div class="cash-row"><div class="cash-label"><span class="field-label"><span id="spendTitleText">区间投入</span><button type="button" class="field-info" data-help="spent" aria-label="投入说明"><svg aria-hidden="true"><use href="#info"/></svg></button></span><strong id="rangeSpent">$0.00</strong></div><div class="bar" aria-hidden="true"><span id="spentBar" class="capital"></span></div></div>
          <div class="cash-row"><div class="cash-label"><span class="field-label"><span>出金到账</span><button type="button" class="field-info" data-help="received" aria-label="出金到账说明"><svg aria-hidden="true"><use href="#info"/></svg></button></span><strong id="rangeReceived">$0.00</strong></div><div class="bar" aria-hidden="true"><span id="coveredBar" class="capital"></span><span id="rangeProfitBar" class="profit"></span></div></div>
          <figcaption class="cash-legend"><span id="coveredLegend" class="legend-item"><i class="swatch" aria-hidden="true"></i>覆盖投入</span><span id="profitLegend" class="legend-item"><i class="swatch profit-color" aria-hidden="true"></i>净收益</span></figcaption>
        </figure>
      </section>
      <section class="zone account-zone" data-node="editorial/accounts">
        <h2 class="zone-heading"><span class="section-icon" aria-hidden="true"><svg><use href="#accounts"/></svg></span>当前账号状态<button type="button" class="field-info" data-help="accounts" aria-label="账号状态说明"><svg aria-hidden="true"><use href="#info"/></svg></button></h2>
        <div class="account-summary" data-node="editorial/account-summary">
          <div class="account-primary"><div class="account-value"><strong>7</strong><span>个</span></div><div class="account-label">进行中</div></div>
          <dl class="account-breakdown" aria-label="进行中账号阶段分布" data-node="editorial/account-breakdown"><div><dt>考核中</dt><dd class="count-badge">4</dd></div><div><dt>待激活</dt><dd class="count-badge">1</dd></div><div><dt>资金账号</dt><dd class="count-badge">2</dd></div></dl>
        </div>
        <div class="account-total"><span>全部账号</span><strong>12</strong></div>
      </section>
    </div>
  </section>
  <p id="rangeDatasetNote" class="dataset-note">离线快照：2026/10/01–10/26。不实时读取数据库。</p>
</main>
</div></div>
<div id="rangePicker" class="range-picker popover" data-slot="popover-content" role="dialog" aria-label="选择日期范围" data-node="editorial/date-range-picker" data-specnav-component="date-range" hidden>
  <nav id="rangePresets" class="range-presets" aria-label="快捷日期范围"></nav>
  <div class="calendar-area"><div class="picker-nav"><button type="button" class="ui-button" data-variant="ghost" data-calendar-nav="-1" aria-label="上一个月"><svg aria-hidden="true"><use href="#chevronLeft"/></svg></button><button type="button" class="ui-button" data-variant="ghost" data-calendar-nav="1" aria-label="下一个月"><svg aria-hidden="true"><use href="#chevronRight"/></svg></button></div><div id="rangeMonths" class="range-months"></div></div>
  <div class="picker-footer"><span id="rangeSelectionStatus" role="status">请选择起止日期</span><span>合成样例覆盖09/01–10/26</span></div>
</div>
<div id="metricTooltip" class="metric-tooltip" data-slot="tooltip-content" role="tooltip" data-node="editorial/field-help" data-specnav-component="field-help" hidden></div>
<script src="assets/shell-snapshot.js"></script>
<script src="assets/range-snapshot.js"></script>
<script src="assets/theme-preview.js"></script>
<script src="assets/range-preview.js"></script>
<script src="assets/date-range-picker.js"></script>
<script src="assets/field-tooltips.js"></script>
<script src="app.js"></script>
</body>
</html>
